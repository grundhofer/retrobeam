# Licences of files that cannot carry an SPDX header. RetroBeam's own source
# files keep their headers (CONTRIBUTING.md); this file covers the sebaro
# design-system export, which is written by sebaroDesign's export tool and
# never edited here (docs/sebaro-umbau.md, owner decision F11). When several
# annotations match a path, the last one wins, so the general rule for the
# export comes first and the fonts and marks narrow it.
version = 1

[[annotations]]
path = ["apps/web/src/sebaro/**", "apps/web/public/theme-init.js"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer (sebaro)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["apps/web/src/sebaro/fonts/web/sebaro-sans-*", "apps/web/public/fonts/sebaro-sans-*"]
precedence = "override"
SPDX-FileCopyrightText = ["2019 The Radio-Canada Project Authors", "2026 Sebastian Grundhöfer (sebaro)"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/web/src/sebaro/fonts/web/sebaro-mono-*", "apps/web/public/fonts/sebaro-mono-*"]
precedence = "override"
SPDX-FileCopyrightText = ["2017 IBM Corp.", "2026 Sebastian Grundhöfer (sebaro)"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/web/src/sebaro/brand/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer"
SPDX-License-Identifier = "LicenseRef-sebaro-reserved"
