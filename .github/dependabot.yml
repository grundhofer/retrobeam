# The CLA workflow already allowlists dependabot[bot], so its PRs merge without
# a signature. Grouping keeps the noise to roughly one PR per ecosystem a week
# rather than one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security patches arrive on their own so they are never held up behind a
      # noisy major bump.
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    # The owner keeps RetroBeam on Vitest 4 for now (2026-10-31): the Worker's
    # test pool, @cloudflare/vitest-pool-workers 0.23.0, requires vitest
    # ^4.1.0, and no release supports Vitest 5 yet, so a major bump only
    # opens a red PR (#69). Minor and patch updates of Vitest 4 still come.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
