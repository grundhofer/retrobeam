name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline only reads the repo; nothing here needs a writable token.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it — the e2e leg is the
# expensive one and there is no value in finishing it for a stale commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisories against the two dependencies that actually reach production
      # (the Worker's HTTP framework and the SPA's router). The build chain is
      # noisy and not user-facing, so it does not gate the pipeline.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      # Gate G6 (docs/sebaro-umbau.md §4.2): apps/web/src/sebaro is sebaroDesign's
      # export, byte for byte. Its own checker fails on an edited, a missing or
      # an unlisted file (--strict); nothing here may change it by hand.
      - run: node apps/web/src/sebaro/checks/verify-export.mjs --strict
      # The first production build used to happen inside the deploy job, so a
      # broken Rollup pass or an unresolvable dynamic import merged green.
      - run: pnpm build && test -f apps/web/dist/client/index.html
      - run: pnpm --filter @retrobeam/shared test
      - run: pnpm --filter @retrobeam/worker test
      # One install feeds BOTH the component tests and the e2e run. The root
      # @playwright/test and apps/web's playwright may resolve to different
      # patch releases, so the cache key names every playwright-core version in
      # the lockfile; the runner image is in it because the browser builds are
      # distro-specific, and the browser set because visual.yml caches
      # chromium alone.
      - name: Playwright cache key
        id: pw-key
        run: |
          versions=$(grep -oE '^  playwright-core@[^:]+' pnpm-lock.yaml | sed 's/.*@//' | sort -u | paste -sd+ -)
          test -n "$versions"
          echo "key=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${versions}-chromium-firefox-webkit" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}
      # A run once stalled inside apt-get against the runner's Ubuntu mirror,
      # not in the browser download, and install-deps runs apt on a warm cache
      # too. With these settings a stalled mirror connection times out after
      # 20 s and the download is retried, instead of the step sitting there
      # until its timeout. The file stays in place for the retry step below.
      # The runner image already sets Retries 1 and Timeout 15 in its own
      # apt.conf.d files (one of them is called 80-retries), and apt reads
      # that directory in name order with the last file winning, so the name
      # is chosen to sort after every numbered file and leaves the image's
      # files alone. The step lists every file there that mentions retries or
      # timeouts, in whatever syntax, prints what apt actually loaded, and
      # fails if any of the three values did not win.
      - name: Configure apt retries and timeouts
        timeout-minutes: 1
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/zz-retries > /dev/null
          grep -il -E 'retries|timeout' /etc/apt/apt.conf.d/* || true
          apt-config dump | grep -i acquire
          dump=$(apt-config dump)
          grep -qx 'Acquire::Retries "3";' <<< "$dump"
          grep -qx 'Acquire::http::Timeout "20";' <<< "$dump"
          grep -qx 'Acquire::https::Timeout "20";' <<< "$dump"
      # The install used to hang until the 20-minute job timeout. Each attempt
      # now has its own budget and there is exactly one retry, so a hang costs
      # this step and not the run. On a cache hit only the system packages are
      # installed; the binaries are already in place.
      - name: Install Playwright browsers
        id: pw-install
        timeout-minutes: 5
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox webkit
          else
            pnpm exec playwright install chromium firefox webkit --with-deps
          fi
      # A hang may have left a half-extracted browser behind; a miss starts the
      # retry from an empty browser directory.
      - name: Install Playwright browsers (retry)
        if: steps.pw-install.outcome == 'failure'
        timeout-minutes: 5
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox webkit
          else
            rm -rf ~/.cache/ms-playwright
            pnpm exec playwright install chromium firefox webkit --with-deps
          fi
      # Saved straight after the install rather than at the end of the job, so
      # a red test run still leaves a warm cache for the next one.
      - name: Save Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}
      - run: pnpm --filter @retrobeam/web test
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
