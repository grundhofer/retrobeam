# A before/after picture report for every PR: the base commit draws the
# baseline, the head commit is compared against it (e2e/visual.spec.ts). It is
# a report, not a gate — every step that runs the code under test may fail
# without failing the job, and what changed is in the summary and the artifact.
name: Visual diff

on:
  pull_request:
    branches: [main]

# Reads the repo and uploads an artifact; no secrets, no writable token.
permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The browser install is split out of the test steps as in ci.yml: the
      # binaries are cached per lockfile, each attempt has its own timeout and
      # there is exactly one retry. Like everything else here it may fail
      # without failing the job — a missing browser fails the test step after
      # it, and that outcome is what the summary reports. The base and the
      # head may pin different Playwright releases, so each computes its key
      # from its own lockfile.
      - name: Install the base commit's dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Playwright cache key (base)
        id: base-pw-key
        continue-on-error: true
        shell: bash
        run: |
          versions=$(grep -oE '^  playwright-core@[^:]+' pnpm-lock.yaml | sed 's/.*@//' | sort -u | paste -sd+ -)
          test -n "$versions"
          echo "key=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${versions}-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers (base)
        id: base-pw-cache
        if: steps.base-pw-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.base-pw-key.outputs.key }}
      # Stalled apt mirror connections time out after 20 s and are retried,
      # as in ci.yml, which also explains the file name. The file is outside the workspace, so the head checkout
      # below keeps it, but the head installs get their own step so each
      # install's log shows the settings apt loaded.
      - name: Configure apt retries and timeouts (base)
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/zz-retries > /dev/null
          grep -il -E 'retries|timeout' /etc/apt/apt.conf.d/* || true
          apt-config dump | grep -i acquire
          dump=$(apt-config dump)
          grep -qx 'Acquire::Retries "3";' <<< "$dump"
          grep -qx 'Acquire::http::Timeout "20";' <<< "$dump"
          grep -qx 'Acquire::https::Timeout "20";' <<< "$dump"
      - name: Install Playwright browsers (base)
        id: base-pw-install
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.base-pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Install Playwright browsers (base, retry)
        id: base-pw-retry
        if: steps.base-pw-install.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.base-pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            rm -rf ~/.cache/ms-playwright
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Save Playwright browsers (base)
        if: >-
          steps.base-pw-key.outputs.key != '' &&
          steps.base-pw-cache.outputs.cache-hit != 'true' &&
          (steps.base-pw-install.outcome == 'success' || steps.base-pw-retry.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.base-pw-key.outputs.key }}
      # The baseline goes to the runner's temp directory, outside the
      # workspace: the head checkout below cleans the workspace, ignored files
      # included, and would take an in-repo baseline with it.
      - name: Baseline from the base commit
        id: base
        continue-on-error: true
        shell: bash
        env:
          VISUAL_BASELINE_DIR: ${{ runner.temp }}/visual-baseline
        run: pnpm exec playwright test --project=visual --update-snapshots=all --reporter=list
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install the head commit's dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Playwright cache key (head)
        id: head-pw-key
        continue-on-error: true
        shell: bash
        run: |
          versions=$(grep -oE '^  playwright-core@[^:]+' pnpm-lock.yaml | sed 's/.*@//' | sort -u | paste -sd+ -)
          test -n "$versions"
          echo "key=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${versions}-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers (head)
        id: head-pw-cache
        if: steps.head-pw-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.head-pw-key.outputs.key }}
      - name: Configure apt retries and timeouts (head)
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/zz-retries > /dev/null
          grep -il -E 'retries|timeout' /etc/apt/apt.conf.d/* || true
          apt-config dump | grep -i acquire
          dump=$(apt-config dump)
          grep -qx 'Acquire::Retries "3";' <<< "$dump"
          grep -qx 'Acquire::http::Timeout "20";' <<< "$dump"
          grep -qx 'Acquire::https::Timeout "20";' <<< "$dump"
      - name: Install Playwright browsers (head)
        id: head-pw-install
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.head-pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Install Playwright browsers (head, retry)
        id: head-pw-retry
        if: steps.head-pw-install.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.head-pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            rm -rf ~/.cache/ms-playwright
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Save Playwright browsers (head)
        if: >-
          steps.head-pw-key.outputs.key != '' &&
          steps.head-pw-cache.outputs.cache-hit != 'true' &&
          (steps.head-pw-install.outcome == 'success' || steps.head-pw-retry.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.head-pw-key.outputs.key }}
      - name: Compare the head commit
        id: head
        continue-on-error: true
        shell: bash
        env:
          VISUAL_BASELINE_DIR: ${{ runner.temp }}/visual-baseline
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test --project=visual --reporter=list,html
      - uses: actions/upload-artifact@v7
        id: upload
        if: always()
        continue-on-error: true
        with:
          name: visual-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      # Playwright leaves <name>-diff.png next to every picture that changed,
      # and only <name>-actual.png where there was nothing to compare against.
      # A retry writes the same names again, hence the sort -u.
      - name: Summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          HEAD_OUTCOME: ${{ steps.head.outcome }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          changed=""
          missing=""
          if [ -d test-results ]; then
            changed=$(find test-results -name '*-diff.png' | sed -E 's#.*/##; s#-diff\.png$##' | sort -u)
            missing=$(find test-results -name '*-actual.png' | while read -r actual; do
              [ -e "${actual%-actual.png}-expected.png" ] || basename "${actual%-actual.png}"
            done | sort -u)
          fi
          {
            echo "## Visual diff"
            echo
            if [ "$BASE_OUTCOME" != "success" ]; then
              echo "The base commit did not finish its baseline (outcome: $BASE_OUTCOME), so some views had nothing to compare against."
              echo
            fi
            if [ -n "$changed" ]; then
              echo "Views with a diff:"
              echo
              echo "$changed" | sed 's/^/- /'
            elif [ "$HEAD_OUTCOME" = "success" ]; then
              echo "No view changed."
            else
              echo "No picture differs, but the head run did not pass (outcome: $HEAD_OUTCOME); see the report."
            fi
            if [ -n "$missing" ]; then
              echo
              echo "Views without a baseline:"
              echo
              echo "$missing" | sed 's/^/- /'
            fi
            if [ -n "$REPORT_URL" ]; then
              echo
              echo "Expected, actual and diff pictures: [visual-report]($REPORT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
