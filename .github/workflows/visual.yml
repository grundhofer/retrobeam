# The picture gate (owner D79 and F9): every view at a phone and a desktop
# width, light and dark (e2e/visual.spec.ts), compared against the references
# committed in e2e/visual-references. A changed picture fails the job. The job
# then draws the new references and uploads them as the artifact
# „visual-references“: when the change is intended, put them into the PR
# (unzip into e2e/visual-references and commit). The report with expected,
# actual and diff pictures is the artifact „visual-report“.
name: Visual diff

on:
  pull_request:
    branches: [main]

# Reads the repo and uploads artifacts; no secrets, no writable token.
permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The browser install is split out of the test step as in ci.yml: the
      # binaries are cached per lockfile, each attempt has its own timeout and
      # there is exactly one retry.
      - name: Playwright cache key
        id: pw-key
        continue-on-error: true
        shell: bash
        run: |
          versions=$(grep -oE '^  playwright-core@[^:]+' pnpm-lock.yaml | sed 's/.*@//' | sort -u | paste -sd+ -)
          test -n "$versions"
          echo "key=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${versions}-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        if: steps.pw-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}
      - name: Configure apt retries and timeouts
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/zz-retries > /dev/null
          grep -il -E 'retries|timeout' /etc/apt/apt.conf.d/* || true
          apt-config dump | grep -iE 'acquire|dpkg::lock'
          dump=$(apt-config dump)
          grep -qx 'Acquire::Retries "3";' <<< "$dump"
          grep -qx 'Acquire::http::Timeout "20";' <<< "$dump"
          grep -qx 'Acquire::https::Timeout "20";' <<< "$dump"
          grep -qx 'DPkg::Lock::Timeout "120";' <<< "$dump"
      - name: Install Playwright browsers
        id: pw-install
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Install Playwright browsers (retry)
        id: pw-retry
        if: steps.pw-install.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            rm -rf ~/.cache/ms-playwright
            pnpm exec playwright install chromium --with-deps
          fi
      - name: Save Playwright browsers
        if: >-
          steps.pw-key.outputs.key != '' &&
          steps.pw-cache.outputs.cache-hit != 'true' &&
          (steps.pw-install.outcome == 'success' || steps.pw-retry.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.key }}
      - name: Compare against the references
        id: compare
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test --project=visual --reporter=list,html
      - name: Draw the new references
        id: draw
        if: failure() && steps.compare.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: pnpm exec playwright test --project=visual --update-snapshots=all --reporter=list
      - uses: actions/upload-artifact@v7
        id: upload
        if: always()
        continue-on-error: true
        with:
          name: visual-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        id: references
        # What could be drawn, even if a view failed to draw: the summary and
        # the report say which, and only complete sets belong in a commit.
        if: always() && steps.draw.outcome != 'skipped'
        continue-on-error: true
        with:
          name: visual-references
          path: e2e/visual-references/
          if-no-files-found: ignore
          retention-days: 7
      # Playwright leaves <name>-diff.png next to every picture that changed,
      # and only <name>-actual.png where there was no reference yet. A retry
      # writes the same names again, hence the sort -u.
      - name: Summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
          REFERENCES_URL: ${{ steps.references.outputs.artifact-url }}
        run: |
          changed=""
          missing=""
          if [ -d test-results ]; then
            changed=$(find test-results -name '*-diff.png' | sed -E 's#.*/##; s#-diff\.png$##' | sort -u)
            missing=$(find test-results -name '*-actual.png' | while read -r actual; do
              [ -e "${actual%-actual.png}-expected.png" ] || basename "${actual%-actual.png}"
            done | sort -u)
          fi
          {
            echo "## Visual diff"
            echo
            if [ -n "$changed" ]; then
              echo "Views that differ from the references:"
              echo
              echo "$changed" | sed 's/^/- /'
            elif [ "$COMPARE_OUTCOME" = "success" ]; then
              echo "Every view matches its reference."
            else
              echo "No picture differs, but the run did not pass (outcome: $COMPARE_OUTCOME); see the report."
            fi
            if [ -n "$missing" ]; then
              echo
              echo "Views without a reference:"
              echo
              echo "$missing" | sed 's/^/- /'
            fi
            if [ -n "$REPORT_URL" ]; then
              echo
              echo "Expected, actual and diff pictures: [visual-report]($REPORT_URL)"
            fi
            if [ -n "$REFERENCES_URL" ]; then
              echo
              echo "If the change is intended, unzip [visual-references]($REFERENCES_URL) into e2e/visual-references and commit it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
