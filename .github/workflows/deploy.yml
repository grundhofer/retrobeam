# Deploys are gated on the CLOUDFLARE_API_TOKEN secret (plus
# CLOUDFLARE_ACCOUNT_ID) — until those are configured, these jobs are skipped.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preview:
    # Fork PRs never receive CLOUDFLARE_API_TOKEN, so without the repo check
    # every external contribution would show an undiagnosable red check once
    # deploys are switched on. A skipped job shows grey.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:legal
      - name: Build for the preview environment
        run: pnpm --filter @retrobeam/web build
        env:
          CLOUDFLARE_ENV: preview
          # AGPL §13: the running build must link to its own source
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      # `versions upload` cannot create a Worker, only add a version to one that
      # already exists ("You cannot upload a new version of a Worker that does
      # not yet exist"). The retrobeam-preview Worker was therefore bootstrapped
      # once by hand with a plain `wrangler deploy` of the preview build. If the
      # preview Worker is ever deleted, this job starts failing again and the
      # fix is to run that bootstrap once more — not to change this line.
      - name: Upload preview version (alias pr-<number>)
        working-directory: apps/web
        run: pnpm exec wrangler versions upload --preview-alias pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:legal
      - run: pnpm --filter @retrobeam/web build
        env:
          # AGPL §13: the running build must link to its own source
          VITE_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy to production
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
