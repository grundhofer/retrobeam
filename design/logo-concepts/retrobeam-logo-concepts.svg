<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eef8f7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7de7df" stop-opacity=".12"/>
      <stop offset=".62" stop-color="#0e7c7b" stop-opacity=".36"/>
      <stop offset="1" stop-color="#0a5958" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a5f3ee"/>
      <stop offset=".48" stop-color="#0e7c7b"/>
      <stop offset="1" stop-color="#073f3f"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e7c7b"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#dffaf7" stop-opacity=".95"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#18181b" flood-opacity=".08"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="portalClip">
      <ellipse cx="1048" cy="342" rx="82" ry="112"/>
    </clipPath>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #71717a; font-size: 16px; font-weight: 750; letter-spacing: 2px; }
      .title { fill: #18181b; font-size: 31px; font-weight: 760; letter-spacing: -1px; }
      .copy { fill: #52525b; font-size: 18px; font-weight: 450; }
      .word { fill: #18181b; font-size: 38px; font-weight: 800; letter-spacing: -1.5px; }
      .beamword { fill: #0e7c7b; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#page)"/>
  <g class="ui">
    <text x="64" y="70" fill="#18181b" font-size="40" font-weight="800" letter-spacing="-1.7">RetroBeam – Logo-Richtungen</text>
    <text x="64" y="105" fill="#71717a" font-size="18">Vier Vektorideen rund um „das Team zurückbeamen“ · Entwurfsstand, noch keine finale Reinzeichnung</text>

    <!-- 01 / TRANSPORTER CREW -->
    <g filter="url(#shadow)">
      <rect x="64" y="145" width="720" height="410" rx="30" fill="#fff"/>
    </g>
    <text class="eyebrow" x="100" y="190">01 · TRANSPORTER CREW</text>
    <text class="title" x="350" y="244">Das Team materialisiert sich</text>
    <text class="copy" x="350" y="278">Direkt, warm und sofort verständlich.</text>
    <text class="copy" x="350" y="306">Stark als animiertes Ladezeichen.</text>

    <g>
      <ellipse cx="218" cy="427" rx="115" ry="26" fill="#18181b"/>
      <ellipse cx="218" cy="418" rx="92" ry="22" fill="#0e7c7b"/>
      <ellipse cx="218" cy="414" rx="58" ry="12" fill="#dff6f4" opacity=".9"/>
      <path d="M145 212h146l39 205H106Z" fill="url(#beam)"/>
      <ellipse cx="218" cy="211" rx="73" ry="14" fill="#18181b"/>
      <ellipse cx="218" cy="213" rx="56" ry="8" fill="#5eead4" opacity=".55"/>
      <path d="M159 224 133 395M218 224v180M277 224l26 171" fill="none" stroke="#2dd4bf" stroke-linecap="round" stroke-width="4" opacity=".5"/>
      <ellipse cx="218" cy="340" rx="115" ry="92" fill="url(#glow)" opacity=".62"/>

      <g fill="#e8590c">
        <circle cx="174" cy="342" r="14"/>
        <path d="M147 405c2-34 11-51 27-51s25 17 27 51Z"/>
        <circle cx="166" cy="303" r="4" opacity=".6"/>
        <rect x="179" y="287" width="6" height="13" rx="3" opacity=".45"/>
      </g>
      <g fill="#0e7c7b">
        <circle cx="218" cy="317" r="16"/>
        <path d="M185 402c3-39 14-59 33-59s30 20 33 59Z"/>
        <rect x="209" y="267" width="7" height="16" rx="3.5" opacity=".45"/>
        <circle cx="226" cy="288" r="4" opacity=".65"/>
      </g>
      <g fill="#e64980">
        <circle cx="262" cy="342" r="14"/>
        <path d="M235 405c2-34 11-51 27-51s25 17 27 51Z"/>
        <circle cx="270" cy="302" r="4" opacity=".6"/>
        <rect x="253" y="285" width="6" height="13" rx="3" opacity=".45"/>
      </g>
      <g fill="#fff" opacity=".72">
        <circle cx="148" cy="326" r="3"/><circle cx="194" cy="251" r="3"/><circle cx="246" cy="258" r="2.5"/><circle cx="291" cy="337" r="3"/>
      </g>
    </g>
    <text class="word" x="350" y="415">Retro<tspan class="beamword">Beam</tspan></text>
    <text x="350" y="450" fill="#71717a" font-size="15">Wirkung: menschlich · optimistisch · verspieltes Sci-Fi</text>
    <rect x="350" y="478" width="92" height="28" rx="14" fill="#dff6f4"/>
    <text x="396" y="497" fill="#0a5958" font-size="13" font-weight="700" text-anchor="middle">FAVORIT</text>

    <!-- 02 / RETURN PORTAL -->
    <g filter="url(#shadow)">
      <rect x="816" y="145" width="720" height="410" rx="30" fill="#fff"/>
    </g>
    <text class="eyebrow" x="852" y="190">02 · RETURN PORTAL</text>
    <text class="title" x="1162" y="244">Zurück durch das Portal</text>
    <text class="copy" x="1162" y="278">„Retro“ wird zur sichtbaren Rückbewegung.</text>
    <text class="copy" x="1162" y="306">Hochwertiger, abstrakter, weniger verspielt.</text>

    <g>
      <ellipse cx="1048" cy="342" rx="92" ry="123" fill="none" stroke="#18181b" stroke-width="18"/>
      <ellipse cx="1048" cy="342" rx="75" ry="105" fill="url(#glow)"/>
      <ellipse cx="1048" cy="342" rx="82" ry="112" fill="none" stroke="url(#portal)" stroke-width="10"/>
      <path d="M956 343c0-74 38-126 92-126" fill="none" stroke="#0e7c7b" stroke-linecap="round" stroke-width="12"/>
      <path d="m1029 203 27 14-24 19Z" fill="#0e7c7b"/>
      <g clip-path="url(#portalClip)">
        <path d="M972 425 1118 244v181Z" fill="#0e7c7b" opacity=".13"/>
        <g fill="#e8590c">
          <circle cx="1018" cy="345" r="12"/>
          <path d="M996 402c2-29 9-44 22-44s20 15 22 44Z"/>
        </g>
        <g fill="#0e7c7b">
          <circle cx="1049" cy="319" r="14"/>
          <path d="M1023 399c2-34 11-51 26-51s24 17 26 51Z"/>
        </g>
        <g fill="#e64980">
          <circle cx="1081" cy="345" r="12"/>
          <path d="M1059 402c2-29 9-44 22-44s20 15 22 44Z"/>
        </g>
      </g>
      <ellipse cx="1048" cy="429" rx="73" ry="13" fill="#18181b" opacity=".88"/>
      <ellipse cx="1048" cy="425" rx="52" ry="7" fill="#5eead4" opacity=".8"/>
    </g>
    <text class="word" x="1162" y="415">Retro<tspan class="beamword">Beam</tspan></text>
    <text x="1162" y="450" fill="#71717a" font-size="15">Wirkung: filmisch · fokussiert · dynamisch</text>

    <!-- 03 / MATERIALIZE MONOGRAM -->
    <g filter="url(#shadow)">
      <rect x="64" y="590" width="720" height="410" rx="30" fill="#fff"/>
    </g>
    <text class="eyebrow" x="100" y="635">03 · MATERIALIZE MONOGRAM</text>
    <text class="title" x="350" y="690">R + B aus Lichtpartikeln</text>
    <text class="copy" x="350" y="724">Die eigenständigste und skalierbarste Richtung.</text>
    <text class="copy" x="350" y="752">Das Team-Motiv wird zur subtilen Entdeckung.</text>

    <g>
      <rect x="113" y="676" width="190" height="190" rx="48" fill="#092f2f"/>
      <path d="M158 823V715h48c34 0 52 16 52 43 0 17-9 30-27 37l34 28h-38l-29-24h-10v24Zm30-50h18c14 0 22-5 22-15s-8-15-22-15h-18Z" fill="url(#mono)"/>
      <path d="M205 715h11c31 0 47 14 47 39 0 14-6 25-19 32 20 6 30 18 30 36 0 1 0 1-.1 2h-35c0-13-8-20-25-20h-9Z" fill="#dff6f4" opacity=".92"/>
      <g fill="#5eead4">
        <rect x="163" y="692" width="6" height="12" rx="3" opacity=".45"/>
        <rect x="180" y="682" width="5" height="9" rx="2.5" opacity=".7"/>
        <circle cx="232" cy="699" r="4" opacity=".62"/>
        <rect x="266" y="711" width="6" height="13" rx="3" opacity=".45"/>
      </g>
      <circle cx="175" cy="790" r="7" fill="#e8590c"/>
      <circle cx="204" cy="782" r="7" fill="#0e7c7b"/>
      <circle cx="232" cy="790" r="7" fill="#e64980"/>
    </g>
    <text class="word" x="350" y="860">Retro<tspan class="beamword">Beam</tspan></text>
    <text x="350" y="895" fill="#71717a" font-size="15">Wirkung: eigenständig · kompakt · produktnah</text>
    <rect x="350" y="923" width="82" height="28" rx="14" fill="#f4f4f5"/>
    <text x="391" y="942" fill="#52525b" font-size="13" font-weight="700" text-anchor="middle">APP-ICON</text>

    <!-- 04 / CONVERGENCE BOARD -->
    <g filter="url(#shadow)">
      <rect x="816" y="590" width="720" height="410" rx="30" fill="#fff"/>
    </g>
    <text class="eyebrow" x="852" y="635">04 · CONVERGENCE BOARD</text>
    <text class="title" x="1162" y="690">Viele Signale, eine Retro</text>
    <text class="copy" x="1162" y="724">Die Beiträge des Teams fließen ins Board.</text>
    <text class="copy" x="1162" y="752">Erklärt das Produkt, dafür am wenigsten Sci-Fi.</text>

    <g>
      <path d="M875 706c86 0 99 42 161 84" fill="none" stroke="#e8590c" stroke-linecap="round" stroke-width="16"/>
      <path d="M875 785c88 0 104 5 161 18" fill="none" stroke="#0e7c7b" stroke-linecap="round" stroke-width="16"/>
      <path d="M875 864c86 0 101-39 161-49" fill="none" stroke="#e64980" stroke-linecap="round" stroke-width="16"/>
      <circle cx="875" cy="706" r="20" fill="#fff" stroke="#e8590c" stroke-width="9"/>
      <circle cx="875" cy="785" r="20" fill="#fff" stroke="#0e7c7b" stroke-width="9"/>
      <circle cx="875" cy="864" r="20" fill="#fff" stroke="#e64980" stroke-width="9"/>
      <rect x="1015" y="746" width="121" height="105" rx="24" fill="#18181b"/>
      <path d="m1100 851 16 22 2-30Z" fill="#18181b"/>
      <rect x="1035" y="768" width="24" height="34" rx="6" fill="#e8590c" transform="rotate(-4 1047 785)"/>
      <rect x="1065" y="765" width="24" height="34" rx="6" fill="#e8b50c" transform="rotate(3 1077 782)"/>
      <rect x="1094" y="772" width="24" height="34" rx="6" fill="#e64980" transform="rotate(-3 1106 789)"/>
      <path d="M1040 822h71" stroke="#5eead4" stroke-linecap="round" stroke-width="7"/>
    </g>
    <text class="word" x="1162" y="860">Retro<tspan class="beamword">Beam</tspan></text>
    <text x="1162" y="895" fill="#71717a" font-size="15">Wirkung: kollaborativ · klar · werkzeugnah</text>
  </g>
</svg>
